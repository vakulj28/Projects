name: bedrock-chatbot app

on:
  push:
    branches: [main]
    paths:
      - "bedrock-chatbot/app/**"
      - ".github/workflows/bedrock-chatbot-app.yml"
  pull_request:
    paths:
      - "bedrock-chatbot/app/**"
      - ".github/workflows/bedrock-chatbot-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bedrock-chatbot-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- CI: must pass before anything ships ----
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bedrock-chatbot/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bedrock-chatbot/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: bedrock-chatbot/app/dist
          retention-days: 7

  # ---- CD: runs only after CI, and never on a PR ----
  cd:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: bedrock-chatbot/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: bedrock-chatbot/app/dist

      # Each run gets a unique prerelease version so publish never collides.
      - name: Set version
        run: npm version "0.1.0-ci.${{ github.run_number }}" --no-git-tag-version

      # Prerelease versions must not go to the default "latest" tag.
      - name: Publish to GitHub Packages
        run: npm publish --tag ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
