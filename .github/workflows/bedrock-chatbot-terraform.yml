name: bedrock-chatbot Terraform

on:
  push:
    branches: [main]
    paths:
      - "bedrock-chatbot/infra/terraform/**"
      - ".github/workflows/bedrock-chatbot-terraform.yml"
  pull_request:
    paths:
      - "bedrock-chatbot/infra/terraform/**"
      - ".github/workflows/bedrock-chatbot-terraform.yml"
  workflow_dispatch:

# id-token for OIDC; contents read for checkout.
permissions:
  id-token: write
  contents: read

concurrency:
  group: bedrock-chatbot-tf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bedrock-chatbot/infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      # TEMP debug: print the OIDC token claims so we can match the trust policy.
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ['sub','aud','repository','ref','workflow_ref']}, indent=2))
          PY

      - name: Format check
        run: terraform fmt -check -recursive

      # Assume the read-only plan role via GitHub OIDC (no stored keys).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      # -lock=false: the plan role is read-only and can't write the state lock.
      - name: Plan
        id: plan
        run: terraform plan -input=false -lock=false -no-color

      - name: Publish plan to job summary
        if: always()
        run: |
          echo '### Terraform plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.plan.outputs.stdout }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Runs only after plan, never on a PR, and pauses for approval because the
  # environment has a required reviewer. Uses the write-capable apply role.
  apply:
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: bedrock-chatbot-prod
    defaults:
      run:
        working-directory: bedrock-chatbot/infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve
