name: bedrock-chatbot Terraform

on:
  push:
    branches: [main]
    paths:
      - "bedrock-chatbot/infra/terraform/**"
      - ".github/workflows/bedrock-chatbot-terraform.yml"
  pull_request:
    paths:
      - "bedrock-chatbot/infra/terraform/**"
      - ".github/workflows/bedrock-chatbot-terraform.yml"
  workflow_dispatch:

# id-token for OIDC; contents read for checkout.
permissions:
  id-token: write
  contents: read

concurrency:
  group: bedrock-chatbot-tf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bedrock-chatbot/infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Format check
        run: terraform fmt -check -recursive

      # Assume the read-only plan role via GitHub OIDC (no stored keys).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: true

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      # -lock=false: the plan role is read-only and can't write the state lock.
      # The plan stays in this step's log (account ID masked) but isn't
      # republished to the public job summary.
      - name: Plan
        run: terraform plan -input=false -lock=false -no-color -var-file=terraform.tfvars

  # Runs only after plan, never on a PR, and pauses for approval because the
  # environment has a required reviewer. Uses the write-capable apply role.
  apply:
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: bedrock-chatbot-prod
    defaults:
      run:
        working-directory: bedrock-chatbot/infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: true

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve -var-file=terraform.tfvars
