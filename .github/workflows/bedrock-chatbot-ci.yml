name: bedrock-chatbot CI

on:
  push:
    branches: [main]
    paths:
      - "bedrock-chatbot/app/**"
      - ".github/workflows/bedrock-chatbot-ci.yml"
  pull_request:
    paths:
      - "bedrock-chatbot/app/**"
      - ".github/workflows/bedrock-chatbot-ci.yml"

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: bedrock-chatbot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bedrock-chatbot/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bedrock-chatbot/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
